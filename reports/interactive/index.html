<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Matricų daugybos laboratorija</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of five "bench" sections, each an instrument with its controls on top. */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #14213d; --muted: #5a6478; --line: #d8dee8;
  --accent: #d9480f; --cool: #1864ab; --good: #2b8a3e; --warn: #c92a2a; --track: #e8ecf2;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131d; --panel: #161d2a; --ink: #e6eaf2; --muted: #9aa5b8; --line: #2b3546;
  --accent: #ff8a3d; --cool: #6cb2f5; --good: #69db7c; --warn: #ff6b6b; --track: #222b3a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131d; --panel: #161d2a; --ink: #e6eaf2; --muted: #9aa5b8; --line: #2b3546;
  --accent: #ff8a3d; --cool: #6cb2f5; --good: #69db7c; --warn: #ff6b6b; --track: #222b3a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 22px 8px; }
header.top .brand { flex: 1 1 320px; min-width: 0; }
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(28px, 4.2vw, 44px)/1.05 var(--f-display); margin: 8px 0 6px; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.langs { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.langs button { border: 0; background: none; color: var(--muted); font: 600 13px var(--f-mono); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; margin-bottom: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.toc a { white-space: nowrap; text-decoration: none; color: var(--ink); font: 500 13px var(--f-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
nav.toc a:hover, nav.toc a:focus-visible { border-color: var(--accent); outline: none; }
section.bench { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px clamp(14px, 3vw, 28px) 24px; margin-block: 18px; }
section.bench > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
.num { font: 600 13px var(--f-mono); color: var(--accent); }
h2 { font: 700 clamp(22px, 2.8vw, 28px)/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 16px; max-width: 75ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 14px; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ctl label { white-space: nowrap; }
select, input[type="range"] { accent-color: var(--accent); }
select { font: 14px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--muted); font: 500 13px var(--f-body); padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button.act { font: 600 14px var(--f-body); color: #fff; background: var(--accent); border: 0; border-radius: 7px; padding: 8px 16px; cursor: pointer; }
button.ghost { font: 500 14px var(--f-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.fact { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--bg); border-radius: 0 6px 6px 0; margin-top: 12px; font-size: 14px; max-width: 90ch; }
/* race */
.lanes { display: grid; gap: 8px; }
.lane { display: grid; grid-template-columns: minmax(120px, 190px) 1fr minmax(92px, 130px); gap: 12px; align-items: center; }
.lane .who { font: 500 13px var(--f-mono); min-width: 0; overflow-wrap: anywhere; }
.lane .who small { display: block; color: var(--muted); font: 12px var(--f-body); }
.track { height: 22px; background: var(--track); border-radius: 4px; overflow: hidden; position: relative; }
.bar { height: 100%; width: 0; border-radius: 4px; }
.lane .t { font: 600 13px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.lane .t.done { color: var(--good); }
.clock { font: 600 clamp(22px, 3vw, 30px) var(--f-mono); font-variant-numeric: tabular-nums; }
/* player */
.player { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
.player + .player { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
.heat { width: 100%; display: block; cursor: crosshair; border-radius: 4px; }
.live { display: grid; gap: 8px; align-content: start; min-width: 0; }
.live h3 { font: 600 13px var(--f-mono); margin: 0; color: var(--muted); }
.cores { display: grid; grid-template-columns: 34px 1fr 38px; gap: 3px 8px; align-items: center; font: 12px var(--f-mono); }
.cores .b { height: 10px; background: var(--track); border-radius: 2px; overflow: hidden; }
.cores .b i { display: block; height: 100%; width: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font: 12.5px var(--f-mono); }
.kv b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.phase-pill { font: 600 12px var(--f-mono); padding: 3px 8px; border-radius: 999px; color: #fff; justify-self: start; }
.scrub { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.scrub input { flex: 1; min-width: 0; }
/* charts */
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }
.chart .axis { stroke: var(--line); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.45 var(--f-mono); padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--f-mono); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font: 12.5px var(--f-mono); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; background: var(--bg); }
.checks label i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.checks input { margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.readouts div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.readouts small { display: block; color: var(--muted); font-size: 12px; }
.readouts b { font: 600 20px var(--f-mono); font-variant-numeric: tabular-nums; }
.readouts b.over { color: var(--warn); }
.readouts b.ok { color: var(--good); }
table.mini { border-collapse: collapse; font: 12.5px var(--f-mono); width: 100%; }
table.mini th { text-align: right; color: var(--muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--line); }
table.mini td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.mini th:first-child, table.mini td:first-child { text-align: left; }
.tablewrap { overflow-x: auto; }
canvas.strip { width: 100%; height: 120px; display: block; }
footer { color: var(--muted); font-size: 13px; padding-block: 18px 40px; display: grid; gap: 6px; }
footer a { color: var(--cool); }
@media (max-width: 860px) { .player { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .lane { grid-template-columns: 1fr 86px; } .lane .track { grid-column: 1 / -1; grid-row: 2; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="subtitle"></p>
    </div>
    <div class="langs" role="group" aria-label="Kalba / Language">
      <button id="lang-lt" type="button" data-lang="lt">LT</button>
      <button id="lang-en" type="button" data-lang="en">EN</button>
    </div>
  </header>
  <nav class="toc" aria-label="Turinys">
    <a href="#lenktynes" data-i="nav1"></a><a href="#apkrova" data-i="nav2"></a><a href="#laboratorija" data-i="nav3"></a><a href="#amdalas" data-i="nav4"></a><a href="#tlb" data-i="nav5"></a>
  </nav>

  <!-- 1. race -->
  <section class="bench" id="lenktynes">
    <header><span class="num">01</span><h2 data-i="race_h"></h2></header>
    <p class="lede" data-i="race_lede"></p>
    <div class="controls">
      <button class="act" id="race-play" type="button"></button>
      <button class="ghost" id="race-reset" type="button" data-i="reset"></button>
      <div class="ctl"><span data-i="speed"></span><div class="seg" id="race-speed"></div></div>
      <div class="ctl"><label for="race-n">n =</label><select id="race-n"></select></div>
      <div class="ctl"><span data-i="sim_time"></span><span class="clock" id="race-clock">0,000 s</span></div>
    </div>
    <div class="lanes" id="race-lanes"></div>
    <p class="fact" id="race-fact"></p>
  </section>

  <!-- 2. load player -->
  <section class="bench" id="apkrova">
    <header><span class="num">02</span><h2 data-i="load_h"></h2></header>
    <p class="lede" data-i="load_lede"></p>
    <div id="players"></div>
    <div class="controls" style="margin-top:14px">
      <div class="ctl"><label for="cmp-sel" data-i="compare"></label><select id="cmp-sel"></select></div>
    </div>
  </section>

  <!-- 3. lab -->
  <section class="bench" id="laboratorija">
    <header><span class="num">03</span><h2 data-i="lab_h"></h2></header>
    <p class="lede" data-i="lab_lede"></p>
    <div class="controls">
      <div class="ctl"><span data-i="view"></span><div class="seg" id="lab-mode"></div></div>
      <div class="ctl" id="lab-w-ctl"><label for="lab-w" data-i="workers"></label><select id="lab-w"></select></div>
      <div class="ctl" id="lab-n-ctl"><label for="lab-n">n =</label><select id="lab-n"></select></div>
      <div class="ctl"><span data-i="metric"></span><div class="seg" id="lab-metric"></div></div>
      <div class="ctl" id="lab-x-ctl"><span data-i="xaxis"></span><div class="seg" id="lab-x"></div></div>
      <div class="ctl"><span data-i="yaxis"></span><div class="seg" id="lab-y"></div></div>
    </div>
    <div class="checks" id="lab-vars"></div>
    <div class="chart" id="lab-chart"></div>
    <p class="note" data-i="lab_note"></p>
  </section>

  <!-- 4. amdahl -->
  <section class="bench" id="amdalas">
    <header><span class="num">04</span><h2 data-i="am_h"></h2></header>
    <p class="lede" data-i="am_lede"></p>
    <div class="controls">
      <div class="ctl"><label for="am-var" data-i="variant"></label><select id="am-var"></select></div>
      <div class="ctl"><label for="am-n">n =</label><select id="am-n"></select></div>
      <div class="ctl"><label for="am-f">f</label><input id="am-f" type="range" min="0" max="10" step="0.05"><span class="mono" id="am-f-v"></span></div>
      <div class="ctl"><label for="am-r">r (E/P)</label><input id="am-r" type="range" min="0" max="1" step="0.01"><span class="mono" id="am-r-v"></span></div>
      <button class="ghost" id="am-reset" type="button" data-i="use_measured"></button>
    </div>
    <div class="two">
      <div class="chart" id="am-chart"></div>
      <div>
        <div class="tablewrap"><table class="mini" id="am-table"></table></div>
        <p class="fact" id="am-fact"></p>
      </div>
    </div>
  </section>

  <!-- 5. tlb -->
  <section class="bench" id="tlb">
    <header><span class="num">05</span><h2 data-i="tlb_h"></h2></header>
    <p class="lede" data-i="tlb_lede"></p>
    <div class="controls">
      <div class="ctl" style="flex:1 1 320px"><label for="tlb-n">n =</label><input id="tlb-n" type="range" min="1000" max="6000" step="50" style="flex:1"><span class="mono" id="tlb-n-v"></span></div>
    </div>
    <div class="readouts" id="tlb-read"></div>
    <canvas class="strip" id="tlb-strip" height="120"></canvas>
    <p class="note" data-i="tlb_strip_note"></p>
    <div class="two">
      <div class="chart" id="tlb-chart"></div>
      <div class="chart" id="tlb-meas"></div>
    </div>
  </section>

  <footer>
    <div id="foot-author"></div>
    <div data-i="foot_data"></div>
    <div data-i="foot_ai"></div>
  </footer>
</div>

    if (lab.metric === "speedup") series.push({ name: lang === "lt" ? "idealus" : "ideal", color: "#868e96", dash: "5 4", dots: false, points: [[1, 1], [12, 12]] });
    chart(host, { series, xlog: false, ylog: lab.y === "log" && lab.metric !== "speedup", xDomain: [0.5, 12.5], xTicks: [1, 2, 4, 8, 12],
      yFmt: (y) => fmt(y, lab.metric === "speedup" ? 0 : y < 1 ? 2 : 0), xLabel: t("workers"), yLabel: lab.metric === "speedup" ? t("speedup") : t("total") + ", s",
      tip: (se, q) => q[2] ? `${se.name}<br>n = ${lab.n}, ${t("workers").toLowerCase()}: ${q[2].w}<br>${lab.metric === "speedup" ? fmt(q[1], 2) + "×" : fmtT(q[1])}<br>${lang === "lt" ? "paleidimų" : "runs"}: ${q[2].c}` : "" });
  }
}
$("lab-w").onchange = (e) => { lab.w = e.target.value === "best" ? "best" : +e.target.value; labDraw(); };
$("lab-n").onchange = (e) => { lab.n = +e.target.value; labDraw(); };

// ---------------------------------------------------------------- 4. amdahl
const am = { v: "openmp-opt2", n: 4000, f: 3, r: 0.15 };
const amSizes = (v) => Object.keys(B[v]).map(Number).filter((n) => B[v][n][1] && Object.keys(B[v][n]).length > 2);
const measF = () => { const d = get(am.v, am.n, 1); return d ? (100 * d[1]) / d[3] : 3; };
const amdahl = (f, N) => 1 / (f + (1 - f) / N);
const neff = (N) => Math.min(N, 8) + am.r * Math.max(N - 8, 0);
function amBuild() {
  $("am-var").innerHTML = ["openmp-opt2", "mpi-opt", "openmp-opt"].map((v) => `<option value="${v}" ${v === am.v ? "selected" : ""}>${v}</option>`).join("");
  const sizes = amSizes(am.v); if (!sizes.includes(am.n)) am.n = sizes.includes(4000) ? 4000 : sizes[0];
  $("am-n").innerHTML = sizes.map((n) => `<option value="${n}" ${n === am.n ? "selected" : ""}>${n}</option>`).join("");
  $("am-f").value = am.f; $("am-r").value = am.r; amDraw();
}
function amDraw() {
  $("am-f-v").textContent = fmt(am.f, 2) + " %"; $("am-r-v").textContent = fmt(am.r, 2);
  const f = am.f / 100, ws = B[am.v][am.n], t1 = ws[1][3];
  const meas = Object.keys(ws).map(Number).sort((a, b) => a - b).map((w) => [w, t1 / ws[w][3]]);
  const curve = [], ideal = []; for (let N = 1; N <= 12.001; N += 0.25) { curve.push([N, amdahl(f, neff(N))]); ideal.push([N, neff(N)]); }
  chart($("am-chart"), { series: [
      { name: lang === "lt" ? "idealus (N_eff)" : "ideal (N_eff)", color: "#868e96", dash: "5 4", dots: false, points: ideal },
      { name: lang === "lt" ? "Amdalo dėsnis" : "Amdahl's law", color: "var(--accent)", dots: false, width: 2.5, points: curve },
      { name: lang === "lt" ? "išmatuota" : "measured", color: COLORS[am.v], line: true, r: 5, points: meas }],
    xlog: false, ylog: false, xDomain: [0.5, 12.5], xTicks: [1, 2, 4, 6, 8, 10, 12], yDomain: [0, 12], xLabel: "N", yLabel: lang === "lt" ? "pagreitėjimas" : "speedup",
    yFmt: (y) => fmt(y, 0), tip: (se, q) => `${se.name}<br>N = ${q[0]}<br>${fmt(q[1], 2)}×` });
  const rows = meas.filter(([N]) => N > 1).map(([N, S]) => { const e = (1 / S - 1 / N) / (1 - 1 / N); return `<tr><td>${N}</td><td>${fmt(S, 2)}×</td><td>${fmt(amdahl(f, neff(N)), 2)}×</td><td>${fmt(100 * e, 1)} %</td></tr>`; });
  $("am-table").innerHTML = `<tr>${t("am_th").map((h) => `<th>${h}</th>`).join("")}</tr>` + rows.join("");
  const s8 = meas.find((m) => m[0] === 8);
  $("am-fact").textContent = `${t("am_meas_f")(fmt(measF(), 2) + " %")}. ` + (s8 ? t("am_fact")(am.n, fmt(s8[1], 2) + "×", fmt(amdahl(measF() / 100, neff(8)), 2) + "×") : "");
}
$("am-var").onchange = (e) => { am.v = e.target.value; amBuild(); am.f = +measF().toFixed(2); amBuild(); };
$("am-n").onchange = (e) => { am.n = +e.target.value; am.f = +measF().toFixed(2); amBuild(); };
$("am-f").oninput = (e) => { am.f = +e.target.value; amDraw(); };
$("am-r").oninput = (e) => { am.r = +e.target.value; amDraw(); };
$("am-reset").onclick = () => { am.f = +measF().toFixed(2); am.r = 0.15; amBuild(); };

// ---------------------------------------------------------------- 5. tlb
const tlbS = { n: 4000 };
const PAGE = 16384, LINE = 128;
function tlbDraw() {
  const n = tlbS.n, stride = 4 * n, pages = Math.ceil((4 * n * n) / PAGE), pNew = Math.min(1, stride / PAGE), foot = n * LINE;
  $("tlb-n-v").textContent = String(n);
  const over = pages > 3072;
  $("tlb-read").innerHTML = `<div><small>${t("stride")}</small><b>${fmt(stride, 0)} B</b></div>
    <div><small>${t("new_line")}</small><b>100 %</b></div>
    <div><small>${t("new_page")}</small><b>${fmt(100 * pNew, 1)} %</b></div>
    <div><small>${t("pages")}</small><b class="${over ? "over" : "ok"}">${fmt(pages, 0)}</b><small>${t("tlb_cap")}</small></div>
    <div><small>${t("used")}</small><b>${fmt((100 * 4) / LINE, 1)} %</b></div>
    <div><small>${t("fits")} (${fmt(foot / 1024, 0)} KB)</small><b>${foot <= 131072 ? t("fits_l1") : foot <= 16 << 20 ? t("fits_l2") : t("fits_no")}</b></div>`;
  // strip: memory pages and consecutive column elements
  const cv = $("tlb-strip"), W = cv.clientWidth || 600, H = 120, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = H * dpr; const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const bytes = stride * 7.5, scale = (W - 20) / bytes, cs = getComputedStyle(document.body);
  const ink = cs.color, muted = getComputedStyle(document.documentElement).getPropertyValue("--muted"), line = getComputedStyle(document.documentElement).getPropertyValue("--line");
  const pal = ["#1c62b0", "#d9480f", "#2b8a3e", "#7048e8", "#c92a2a", "#0b7a57", "#f08c00"];
  for (let p = 0; p * PAGE < bytes; p++) {
    const x = 10 + p * PAGE * scale; g.fillStyle = p % 2 ? "rgba(128,140,160,0.18)" : "rgba(128,140,160,0.08)"; g.fillRect(x, 40, PAGE * scale, 40);
    g.strokeStyle = "#c92a2a"; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(x, 34); g.lineTo(x, 86); g.stroke(); g.setLineDash([]);
  }
  let lastPage = -1, col = -1;
  for (let i = 0; i < 8; i++) {
    const off = 2000 + i * stride; if (off > bytes) break; const x = 10 + off * scale, page = Math.floor(off / PAGE);
    if (page !== lastPage) { col++; lastPage = page; }
    g.fillStyle = pal[col % pal.length]; g.beginPath(); g.arc(x, 60, 6, 0, 7); g.fill();
    g.fillStyle = ink; g.font = "11px " + cs.fontFamily; g.textAlign = "center"; g.fillText(`B[${i}][j]`, x, 102);
    if (i) { const px = 10 + (off - stride) * scale; g.strokeStyle = muted; g.lineWidth = 1.2; g.beginPath(); g.moveTo(px + 7, 24); g.quadraticCurveTo((px + x) / 2, 8, x - 7, 24); g.stroke(); }
  }
  g.fillStyle = muted; g.textAlign = "left"; g.fillText(`+${fmt(stride, 0)} B`, 14, 14);
  // charts
  const series = ["seq-base", "openmp-base", "mpi-base"].map((v) => ({ name: v, color: COLORS[v],
    points: Object.keys(B[v]).map(Number).filter((k) => k <= 4000 && B[v][k][1]).sort((a, b) => a - b).map((k) => [k, (B[v][k][1][2] / k ** 3) * 1e9]) }));
  const sb = series[0].points; let yN = null;
  for (let i = 0; i < sb.length - 1; i++) if (n >= sb[i][0] && n <= sb[i + 1][0]) yN = sb[i][1] + ((n - sb[i][0]) / (sb[i + 1][0] - sb[i][0])) * (sb[i + 1][1] - sb[i][1]);
  chart($("tlb-chart"), { title: t("tlb_chart"), series, xlog: false, ylog: false, xDomain: [1900, 4100], xTicks: [2000, 2500, 3000, 3500, 4000],
    vlines: [{ x: 3547, label: "3547", color: "#c92a2a" }, { x: Math.min(4090, Math.max(1910, n)), color: "var(--accent)", dash: "1 0" }],
    markers: yN ? [{ x: n, y: yN, color: "var(--accent)" }] : [], xFmt: (x) => String(x), yFmt: (y) => fmt(y, 1), xLabel: "n", yLabel: "ns",
    tip: (se, q) => `${se.name}<br>n = ${q[0]}<br>${fmt(q[1], 2)} ns` });
  const tl = DATA.mem.tlb.filter((q) => q[0] <= 6144);
  const px = Math.max(16, Math.min(6144, pages));
  let yP = null; for (let i = 0; i < tl.length - 1; i++) if (px >= tl[i][0] && px <= tl[i + 1][0]) yP = tl[i][1];
  chart($("tlb-meas"), { title: t("tlb_meas"), series: [{ color: "var(--cool)", points: tl }], xlog: true, ylog: false, xTicks: [16, 64, 256, 1024, 3072, 6144],
    vlines: [{ x: 3072, label: "3072", color: "#c92a2a" }, { x: px, color: "var(--accent)", dash: "1 0" }], markers: yP != null ? [{ x: px, y: yP, color: "var(--accent)" }] : [],
    xFmt: (x) => String(x), yFmt: (y) => fmt(y, 0), xLabel: t("pages"), yLabel: "ns", tip: (se, q) => `${fmt(q[0], 0)} ${lang === "lt" ? "puslapių" : "pages"}<br>${fmt(q[1], 2)} ns` });
}
$("tlb-n").oninput = (e) => { tlbS.n = +e.target.value; tlbDraw(); };

// ---------------------------------------------------------------- language + init
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((el) => { const v = I[lang][el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.title = t("title");
  $("foot-author").innerHTML = `<a href="${DATA.repo}" target="_blank" rel="noopener">${DATA.repo.replace("https://", "")}</a> · ${t("generated")} ${DATA.generated}`;
  raceBuild(); buildPlayers(); labBuild(); amBuild(); $("tlb-n").value = tlbS.n; tlbDraw();
}
document.querySelectorAll(".langs button").forEach((b) => (b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("mm-lang", lang); } catch (e) {} applyLang(); }));
am.f = +measF().toFixed(2);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { players.forEach((p) => p.update()); labDraw(); amDraw(); tlbDraw(); }, 150); });
applyLang();
})();
</script>
